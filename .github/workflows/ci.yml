name: AIMachina XLab CI Pipeline

on:
  push:
    branches: [ main, master, decision-tree-backup ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build, Typecheck and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Static Type Checking
        run: npm run check

      - name: Run Unit Tests
        run: npm run test

      - name: Build Production Bundle
        run: npm run build
